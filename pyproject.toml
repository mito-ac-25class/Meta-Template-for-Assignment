[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-template-assignment"
version = "2.0.0"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "jinja2>=3.0",
]
django-react = [
    "django>=4.2",
    "djangorestframework>=3.14",
    "pytest-django>=4.5",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
pythonpath = ["src"]
