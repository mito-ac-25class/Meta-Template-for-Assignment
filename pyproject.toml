[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-template-assignment"
version = "2.0.0"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "jinja2>=3.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
pythonpath = ["src"]
# Phase 1: 静的マーカー定義（既存テストとの互換維持）
# Phase 3 で conftest.py による動的登録に移行予定
markers = [
    "stage01: Stage 01 tests",
    "stage02: Stage 02 tests",
    "stage03: Stage 03 tests",
    "stage04: Stage 04 tests",
    "stage05: Stage 05 tests",
]
