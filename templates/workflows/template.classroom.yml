# 汎用ワークフローテンプレート（classroom.yml用）
# 
# このファイルは言語プロファイルに基づいて classroom.yml を生成するためのテンプレートです。
# プレースホルダ（$変数名）はプロファイルの設定値に置換されます。
#
# 使用方法:
# 1. `agent-input/topics.md` で言語プロファイルを指定
# 2. `/implement-test.admin` 実行時にこのテンプレートを基に classroom.yml を生成
# 3. プロファイルの設定に応じてセットアップコマンドとテスト実行コマンドが自動設定

# ============================================
# プレースホルダ一覧
# ============================================
# $SETUP_COMMANDS    - 環境セットアップコマンド（プロファイルの ci.setup_commands から）
# $STAGE_TESTS       - ステージ別テストステップ（動的生成）
# $TEST_RESULTS_ENV  - テスト結果の環境変数（動的生成）
# $TEST_RUNNERS      - テストランナー一覧（動的生成）

# ============================================
# 汎用テンプレート
# ============================================

name: Autograding Tests
'on':
  - push
  - repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup environment
      run: |
        $SETUP_COMMANDS
    
    # ============================================
    # ステージテスト（動的生成セクション）
    # ============================================
    # 以下は各ステージのテスト定義です。
    # 言語プロファイルと agent-output/plan.md のステージ構成に基づいて生成されます。
    #
    # 各ステージの設定項目:
    # - test-name: テスト識別子
    # - command: テスト実行コマンド（プロファイルの testing.run_command から）
    # - timeout: タイムアウト秒数（プロファイルの ci.timeout_default から）
    # - max-score: 配点（plan.md のステージ構成から）
    
    $STAGE_TESTS
    
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        $TEST_RESULTS_ENV
      with:
        runners: $TEST_RUNNERS

