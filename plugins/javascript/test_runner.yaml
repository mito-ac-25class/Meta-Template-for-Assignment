# JavaScript テストランナー設定リファレンス
# src/kadai/package.json の jest 設定に反映される設定

framework: jest
min_version: "29.0"

# Jest 設定
config:
  testMatch: ["**/tests/stages/**/test_*.test.js"]
  rootDir: "."

# テスト実行コマンド
commands:
  # 全テスト実行
  all: "npx --prefix src/kadai jest tests/stages/ --verbose"
  # ステージ単体
  stage: "npx --prefix src/kadai jest tests/stages/stageXX/ --verbose"
  # デバッグ
  debug: "npx --prefix src/kadai jest tests/stages/stageXX/ --verbose --detectOpenHandles"
  # キーワード検索
  keyword: "npx --prefix src/kadai jest -t 'keyword' --verbose"

# CI での実行
ci:
  install: "cd src/kadai && npm ci"
  command: "npx --prefix src/kadai jest tests/stages/stageXX/ --passWithNoTests"
  timeout: 10
