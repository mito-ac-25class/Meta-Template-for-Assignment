# JavaScript テストランナー設定リファレンス
# src/kadai/package.json の jest 設定に反映される設定

framework: jest
min_version: "29.0"

# Jest 設定
config:
  rootDir: "../.."
  testMatch: ["<rootDir>/tests/stages/**/test_*.test.js"]

# テスト実行コマンド
commands:
  # 全テスト実行
  all: "npx jest --config src/kadai/package.json tests/stages/ --verbose"
  # ステージ単体
  stage: "npx jest --config src/kadai/package.json tests/stages/stageXX/ --verbose"
  # デバッグ
  debug: "npx jest --config src/kadai/package.json tests/stages/stageXX/ --verbose --detectOpenHandles"
  # キーワード検索
  keyword: "npx jest --config src/kadai/package.json -t 'keyword' --verbose"

# CI での実行
ci:
  install: "cd src/kadai && npm ci"
  command: "npx jest --config src/kadai/package.json tests/stages/stageXX/ --passWithNoTests"
  timeout: 10
