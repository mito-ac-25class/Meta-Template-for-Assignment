# Django + React CI セットアップ参照
# classroom.yml.j2 テンプレートが使用する CI 設定の参考

# 環境セットアップ
setup:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install backend dependencies
      run: pip install pytest pytest-django django djangorestframework

    - name: Install frontend dependencies
      run: |
        cd src/kadai/frontend
        npm ci

# 自動採点
autograding:
  grader: classroom-resources/autograding-command-grader@v1
  reporter: classroom-resources/autograding-grading-reporter@v1
  # 各ステージは topics.yaml の stages から自動生成
  # ステージごとに backend (pytest) と frontend (jest) を順次実行
  # python scripts/generate.py classroom で classroom.yml を生成
