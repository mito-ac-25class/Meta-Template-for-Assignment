# 言語プロファイルスキーマ定義 v1.0
# 
# このファイルは言語プロファイルのスキーマを定義します。
# 新しい言語プロファイルを作成する際は、このスキーマに従ってください。

version: "1.0"
description: "Meta-Template-for-Assignment 言語プロファイルスキーマ"

# ============================================
# スキーマ定義
# ============================================
schema:
  # --------------------------------------------
  # 必須フィールド: プロファイル識別情報
  # --------------------------------------------
  required:
    name:
      type: string
      description: "プロファイル識別子（例: python-pytest, java-junit）"
      pattern: "^[a-z][a-z0-9-]*[a-z0-9]$"  # 先頭は小文字、末尾は英数字、中間はハイフン可
      
    display_name:
      type: string
      description: "表示名（例: Python 3.12 + pytest）"
      
    language:
      type: string
      description: "言語名（例: python, java, javascript, go）"
      enum:
        - python
        - java
        - javascript
        - typescript
        - go
        - csharp
        - ruby
        # 注: 新しい言語はプロファイル実装と共に追加
        
    version:
      type: string
      description: "言語バージョン（例: 3.12, 21, 20）"

  # --------------------------------------------
  # 必須フィールド: 開発環境設定
  # --------------------------------------------
    devcontainer:
      type: object
      required:
        - image
        - extensions
      properties:
        image:
          type: string
          description: "Docker イメージ名"
        extensions:
          type: array
          items:
            type: string
          description: "VS Code 拡張機能ID一覧"
        settings:
          type: object
          description: "VS Code 設定"
        post_create_command:
          type: string
          description: "コンテナ作成後に実行するコマンド"

  # --------------------------------------------
  # 必須フィールド: テスト設定
  # --------------------------------------------
    testing:
      type: object
      required:
        - framework
        - install_command
        - run_command
        - marker_format
        - test_file_pattern
        - test_directory
      properties:
        framework:
          type: string
          description: "テストフレームワーク名（例: pytest, junit, jest）"
        install_command:
          type: string
          description: "テストフレームワークのインストールコマンド"
        run_command:
          type: string
          description: "テスト実行コマンド。{marker} プレースホルダ使用可能"
        marker_format:
          type: string
          description: "ステージマーカー形式。{num:02d} で2桁ゼロ埋め"
        test_file_pattern:
          type: string
          description: "テストファイルのglobパターン"
        test_directory:
          type: string
          description: "テストファイルを配置するディレクトリ"
        stage_directory_format:
          type: string
          description: "ステージディレクトリの命名形式"
        config_file:
          type: string
          description: "テスト設定ファイル名"
        config_template:
          type: string
          description: "テスト設定ファイルのテンプレート"

  # --------------------------------------------
  # 必須フィールド: 依存関係管理
  # --------------------------------------------
    dependencies:
      type: object
      required:
        - file
        - install_command
      properties:
        file:
          type: string
          description: "メイン依存関係ファイル名"
        dev_file:
          type: string
          nullable: true
          description: "開発用依存関係ファイル名（なければnull）"
        install_command:
          type: string
          description: "依存関係インストールコマンド"
        dev_install_command:
          type: string
          description: "開発用依存関係インストールコマンド（オプション）"
        default_dependencies:
          type: array
          description: "デフォルトで含める依存関係（オプション）"
        default_dev_dependencies:
          type: array
          description: "デフォルトで含める開発用依存関係（オプション）"

  # --------------------------------------------
  # 必須フィールド: ソースコード構成
  # --------------------------------------------
    source:
      type: object
      required:
        - directory
        - file_extension
      properties:
        directory:
          type: string
          description: "ソースコードを配置するディレクトリ"
        file_extension:
          type: string
          description: "ソースファイルの拡張子"
        import_format:
          type: string
          description: "インポート文の形式"
        import_format_esm:
          type: string
          description: "ES Modules形式のインポート文（JavaScript用、オプション）"
        package_name:
          type: string
          description: "パッケージ名（Java等のパッケージベース言語用、オプション）"

  # --------------------------------------------
  # 必須フィールド: CI/CD設定
  # --------------------------------------------
    ci:
      type: object
      required:
        - setup_commands
        - timeout_default
      properties:
        setup_commands:
          type: array
          items:
            type: string
          description: "CIでのセットアップコマンド一覧"
        timeout_default:
          type: number
          description: "デフォルトのタイムアウト秒数"
        default_score_per_stage:
          type: number
          description: "ステージあたりのデフォルト配点"

  # --------------------------------------------
  # 必須フィールド: テスト実装ガイド
  # --------------------------------------------
    test_implementation:
      type: object
      required:
        - example
        - marker_decorator
        - import_location
      properties:
        example:
          type: string
          description: "テストコードの例（Markdownコードブロック形式）"
        marker_decorator:
          type: string
          description: "マーカー/タグの記述形式。{marker}プレースホルダ使用可能"
        import_location:
          type: string
          enum:
            - inside_function
            - top_of_file
          description: |
            インポート文を書く場所:
            - inside_function: テスト関数内でインポート（pytest推奨、遅延評価）
            - top_of_file: ファイル先頭でインポート（Java, JavaScript等）
        function_naming:
          type: string
          description: "テスト関数の命名規則（例: test_{description}）"
        method_naming:
          type: string
          description: "テストメソッドの命名規則（function_namingの代替、Java等用）"
        class_naming:
          type: string
          description: "テストクラスの命名規則（該当言語のみ）"
        describe_naming:
          type: string
          description: "describeブロックの命名規則（Jest等用、オプション）"
        test_naming:
          type: string
          description: "testブロックの命名規則（Jest等用、オプション）"
        require_comment_before_assertion:
          type: boolean
          description: "アサーション前のコメント必須フラグ"
        comment_language:
          type: string
          enum:
            - ja
            - en
          description: "コメントの言語"

  # --------------------------------------------
  # オプションフィールド: 追加設定
  # --------------------------------------------
  optional:
    additional:
      type: object
      description: |
        言語/フレームワーク固有の追加設定。
        以下は一般的なフィールドの例。他にも言語固有のフィールドを自由に追加可能。
      properties:
        lint_command:
          type: string
          description: "Lintコマンド"
        format_command:
          type: string
          description: "フォーマットコマンド"
        type_check_command:
          type: string
          description: "型チェックコマンド"
        build_command:
          type: string
          description: "ビルドコマンド"
        coverage_command:
          type: string
          description: "カバレッジ測定コマンド"
        package_command:
          type: string
          description: "パッケージ/ビルドコマンド（Maven package等）"
        package_scripts:
          type: object
          description: "package.jsonのscriptsセクション設定例（JavaScript用）"
      additionalProperties: true  # 言語固有の追加フィールドを許可

# ============================================
# プレースホルダ仕様
# ============================================
# 注意: これらのプレースホルダはエージェントが解釈し、
# 実際のテンプレート生成時に適切な値に置換されます。
# Python形式の {num:02d} 記法は概念的な仕様であり、
# 実装時に各言語のテンプレートシステムに合わせて変換されます。
placeholders:
  "{marker}":
    description: "ステージマーカー文字列に置換される"
    example: "stage01, Stage01"
    
  "{num:02d}":
    description: "2桁ゼロ埋めのステージ番号に置換される（概念的表記）"
    example: "01, 02, 03"
    
  "{num}":
    description: "ステージ番号に置換される"
    example: "1, 2, 3"
    
  "{module}":
    description: "モジュール名に置換される"
    example: "example, bank_account"
    
  "{class_or_function}":
    description: "クラス名または関数名に置換される"
    example: "ExampleClass, calculate"
    
  "{description}":
    description: "テスト説明に置換される"
    example: "exists, returns_expected_value"
