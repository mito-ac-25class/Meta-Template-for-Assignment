# テンプレート状態の注意事項:
# - このワークフローはテンプレート状態では各ステージのテストがスキップされます
# - `/implement-test.admin` を実行して実際のテストを実装する必要があります
# - テスト実装前は全てのテストがスキップされるため、CI は成功しますが採点は行われません

name: Autograding Tests
'on':
  - push
  - repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup environment
      run: |
        pip install pytest
    
    - name: test1
      id: test1
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: test1
        command: "pytest -m 'stage01'"
        timeout: 10
        max-score: 20
    - name: test2
      id: test2
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: test2
        command: "pytest -m 'stage02'"
        timeout: 10
        max-score: 20
    - name: test3
      id: test3
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: test3
        command: "pytest -m 'stage03'"
        timeout: 10
        max-score: 20
    - name: test4
      id: test4
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: test4
        command: "pytest -m 'stage04'"
        timeout: 10
        max-score: 20
    - name: test5
      id: test5
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: test5
        command: "pytest -m 'stage05'"
        timeout: 10
        max-score: 20
       
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST1_RESULTS: "${{steps.test1.outputs.result}}"
        TEST2_RESULTS: "${{steps.test2.outputs.result}}"
        TEST3_RESULTS: "${{steps.test3.outputs.result}}"
        TEST4_RESULTS: "${{steps.test4.outputs.result}}"
        TEST5_RESULTS: "${{steps.test5.outputs.result}}"
      with:
        runners: test1,test2,test3,test4,test5